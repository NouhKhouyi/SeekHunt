<!doctype html>
<!-- Dev-only page used by scripts/hero-map.mjs to render the home hero map. Not part of the build. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body { margin: 0; }
      #m { width: 1400px; height: 1750px; }
    </style>
  </head>
  <body>
    <div id="m"></div>
    <script type="module">
      import * as maplibregl from "maplibre-gl";
      import "maplibre-gl/dist/maplibre-gl.css";
      import { HERO_CENTER, HERO_ZOOM } from "/src/heroGeometry.ts";

      const style = new URLSearchParams(location.search).get("style") ?? "positron";
      const map = new maplibregl.Map({
        container: "m",
        style: `https://tiles.openfreemap.org/styles/${style}`,
        center: [HERO_CENTER.lng, HERO_CENTER.lat],
        zoom: HERO_ZOOM,
        attributionControl: false,
        interactive: false,
        canvasContextAttributes: { preserveDrawingBuffer: true },
      });
      map.on("load", () => {
        // Street texture only: no labels, no POI icons.
        for (const layer of map.getStyle().layers) if (layer.type === "symbol") map.removeLayer(layer.id);
        map.once("idle", () => (window.__ready = true));
      });
    </script>
  </body>
</html>
